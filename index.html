<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f6f6f3;--panel:#ffffff;--p2:#fafaf8;--bd:#e4e4dd;--b2:#d0d0c6;
  --acc:#8a6a1c;--acc2:#6f5516;--pos:#1d6b4c;--neg:#9b2f2f;--inf:#2c5680;
  --tx:#1c2026;--tx2:#5a636e;--mu:#949aa3;
}
body{background:var(--bg);color:var(--tx);font-family:"IBM Plex Sans",sans-serif;font-size:12.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--b2);border-radius:5px;border:2px solid var(--bg)}
a{color:var(--inf);text-decoration:none;cursor:pointer}
a:hover{text-decoration:underline}
h1,h2,h3,h4{font-weight:600}

.hdr{display:flex;align-items:center;justify-content:space-between;padding:0 22px;height:52px;background:var(--panel);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:600;gap:14px}
.logo{font-family:"IBM Plex Mono";font-size:14px;font-weight:600;letter-spacing:2.5px;color:var(--tx);white-space:nowrap}
.logo span{color:var(--mu);font-weight:400;font-size:9px;margin-left:10px;letter-spacing:1.5px}
.hright{font-family:"IBM Plex Mono";font-size:8px;color:var(--mu);display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.hbadge{padding:3px 8px;border:1px solid var(--bd);border-radius:3px;font-family:"IBM Plex Mono";font-size:8px;color:var(--tx2);white-space:nowrap;background:var(--p2)}
.hbadge b{color:var(--acc);font-weight:600}
.hbadge.stale{border-color:#e8cfcf;background:#fdf6f6;color:#8c4a4a}
.hbadge.fresh{border-color:#c9e2d5;background:#f4faf7;color:var(--pos)}

.tabs{display:flex;background:var(--panel);border-bottom:1px solid var(--bd);padding:0 16px;position:sticky;top:52px;z-index:599;overflow-x:auto;box-shadow:0 1px 3px rgba(0,0,0,.03)}
.tab{padding:11px 15px;font-family:"IBM Plex Mono";font-size:8.5px;letter-spacing:1.3px;color:var(--tx2);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;text-transform:uppercase;transition:all .12s;user-select:none}
.tab:hover{color:var(--tx);background:var(--p2)}
.tab.on{color:var(--acc2);border-color:var(--acc)}
.tab i{font-style:normal;color:var(--mu);margin-right:6px}
.tab.on i{color:var(--acc)}

.panel{display:none}.panel.act{display:block}
.w{max-width:1760px;margin:0 auto;padding:16px 22px 70px}
.sh{font-family:"IBM Plex Mono";font-size:8px;letter-spacing:2px;color:var(--tx2);display:flex;align-items:center;gap:10px;margin:26px 0 10px;text-transform:uppercase}
.sh:first-child{margin-top:6px}
.sh b{color:var(--acc2);font-weight:600}
.sh::after{content:"";flex:1;height:1px;background:var(--bd)}
.lede{color:var(--tx2);font-size:12.5px;max-width:1080px;margin-bottom:14px;line-height:1.65}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1400px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:900px){.g2,.g3,.g4{grid-template-columns:1fr}}

.card{background:var(--panel);border:1px solid var(--bd);border-radius:5px;padding:14px 16px;box-shadow:0 1px 2px rgba(20,25,35,.03)}
.card.hl{border-color:var(--acc);box-shadow:0 0 0 2px rgba(138,106,28,.08)}
.ct{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-bottom:1px solid var(--bd);padding-bottom:9px;margin-bottom:11px}
.ctl{font-family:"IBM Plex Mono";font-size:16px;font-weight:600;letter-spacing:.5px;color:var(--tx)}
.ctl small{display:block;font-size:9px;letter-spacing:.8px;color:var(--mu);font-weight:400;margin-top:3px;text-transform:none}
.ctr{font-family:"IBM Plex Mono";font-size:16px;font-weight:600;text-align:right}
.ctr small{display:block;font-size:9.5px;font-weight:500;margin-top:2px}
.desk{font-family:"IBM Plex Mono";font-size:7.5px;letter-spacing:2px;color:var(--mu);text-transform:uppercase}

.s{font-family:"IBM Plex Mono";font-size:7px;letter-spacing:.5px;padding:1px 4px;border-radius:3px;border:1px solid;vertical-align:middle;margin-left:4px;white-space:nowrap;cursor:help}
.s-co{color:#1d6b4c;border-color:#c9e2d5;background:#f4faf7}
.s-f4{color:#8a6a1c;border-color:#e6dcc0;background:#fbf8ef}
.s-ct{color:#2c5680;border-color:#ccdae8;background:#f5f8fc}
.s-an{color:#9b2f2f;border-color:#e8cfcf;background:#fdf6f6}
.s-fe{color:var(--tx2);border-color:var(--bd);background:var(--p2)}
.s-pf{color:#6b4a9c;border-color:#dbd0ea;background:#faf7fd}
.s-de{color:var(--mu);border-color:var(--bd);background:var(--p2)}

.tag{display:inline-block;font-family:"IBM Plex Mono";font-size:7.5px;letter-spacing:.6px;padding:2px 6px;border-radius:3px;border:1px solid var(--bd);background:var(--p2);color:var(--tx2);margin:1px 3px 1px 0;cursor:pointer;white-space:nowrap}
.tag:hover{border-color:var(--acc);color:var(--acc2)}
.tag.pos{color:var(--pos);border-color:#c9e2d5;background:#f4faf7}
.tag.neg{color:var(--neg);border-color:#e8cfcf;background:#fdf6f6}
.tag.gold{color:var(--acc2);border-color:#e6dcc0;background:#fbf8ef}
.tag.inf{color:var(--inf);border-color:#ccdae8;background:#f5f8fc}
.tag.st{cursor:default}

.blk{border-left:3px solid var(--b2);padding:7px 0 7px 11px;margin:9px 0;font-size:12px}
.blk .h{font-family:"IBM Plex Mono";font-size:7.5px;letter-spacing:1.4px;color:var(--mu);text-transform:uppercase;margin-bottom:3px}
.blk.p{border-color:#7fb59a}.blk.p .h{color:var(--pos)}
.blk.n{border-color:#cf9a9a}.blk.n .h{color:var(--neg)}
.blk.g{border-color:#d3bd7e}.blk.g .h{color:var(--acc2)}
.blk.i{border-color:#93b0cc}.blk.i .h{color:var(--inf)}
.mech{font-family:"IBM Plex Mono";font-size:10.5px;color:var(--tx);background:var(--p2);border:1px solid var(--bd);border-radius:4px;padding:9px 11px;margin:9px 0;line-height:1.7}
.mech .up{color:var(--pos);font-weight:600}.mech .dn{color:var(--neg);font-weight:600}.mech .ar{color:var(--mu);margin:0 4px}
.sign{font-family:"IBM Plex Mono";font-weight:700;padding:0 4px;border-radius:3px}
.sign.plus{color:var(--pos);background:#eaf5ef}
.sign.min{color:var(--neg);background:#fbeded}

.tw{overflow-x:auto;border:1px solid var(--bd);border-radius:5px;margin-bottom:12px;background:var(--panel)}
table{width:100%;border-collapse:collapse}
thead th{background:var(--p2);padding:8px 11px;font-family:"IBM Plex Mono";font-size:7.5px;letter-spacing:1px;text-transform:uppercase;color:var(--tx2);white-space:nowrap;border-bottom:1px solid var(--b2);font-weight:600;text-align:left;user-select:none;position:sticky;top:0}
thead th.srt{cursor:pointer}thead th.srt:hover{color:var(--acc2)}
tbody tr{border-bottom:1px solid var(--bd)}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:#fbfaf6}
td{padding:8px 11px;vertical-align:top;font-size:11.5px}
td.n,th.n{text-align:right;font-family:"IBM Plex Mono"}
.mono{font-family:"IBM Plex Mono"}
.pos{color:var(--pos)}.neg{color:var(--neg)}.gold{color:var(--acc2)}.inf{color:var(--inf)}.mu{color:var(--mu)}.tx2{color:var(--tx2)}
.wrap td{white-space:normal}

.lv{border:1px solid var(--bd);border-radius:4px;margin:8px 0;overflow:hidden}
.lvh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 10px;background:var(--p2);font-family:"IBM Plex Mono";font-size:11px}
.lvh .t{font-weight:600}
.lvq{display:grid;grid-template-columns:104px 1fr;gap:0}
.lvq>div{padding:5px 10px;border-top:1px solid var(--bd);font-size:11px}
.lvq>div:nth-child(odd){font-family:"IBM Plex Mono";font-size:7.5px;letter-spacing:1px;color:var(--mu);text-transform:uppercase;background:var(--p2)}
.q{font-family:"IBM Plex Mono";font-size:7.5px;padding:2px 6px;border-radius:3px;letter-spacing:.7px}

.cone .b{background:#f4faf7;color:var(--pos);text-align:right}

.cone .r{background:#fdf6f6;color:var(--neg)}

.hm td,.hm th{padding:5px 8px;font-size:10.5px;text-align:center;border:1px solid var(--bd)}

.c2{background:#e2f0e8;color:#1a5a3e}
.c1{background:#f0f7f3;color:#2c6b50}

.cm1{background:#fbf0f0;color:#8a4444}
.cm2{background:#f6dede;color:#8a3535}
.cm3{background:#efc9c9;color:#7a2626}

.meter{height:6px;background:var(--bd);border-radius:3px;overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%}
.bar{display:flex;height:20px;border-radius:4px;overflow:hidden;border:1px solid var(--bd);margin:8px 0}
.bar div{font-family:"IBM Plex Mono";font-size:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;overflow:hidden;white-space:nowrap}

.tl{border-left:2px solid var(--bd);margin-left:92px;padding-left:0}
.tli{display:grid;grid-template-columns:1fr;position:relative;padding:11px 0 11px 20px;border-bottom:1px solid var(--bd)}
.tli::before{content:"";position:absolute;left:-6px;top:17px;width:9px;height:9px;border-radius:50%;background:var(--b2);border:2px solid var(--bg)}
.tli.hi::before{background:var(--acc);box-shadow:0 0 0 3px rgba(138,106,28,.12)}
.tli.done::before{background:var(--bd)}
.tld{position:absolute;left:-112px;width:92px;text-align:right;font-family:"IBM Plex Mono";font-size:9.5px;color:var(--acc2);top:11px}
.tld small{display:block;font-size:7px;color:var(--mu);letter-spacing:.8px}
.tli.done .tld{color:var(--mu)}
.tlt{font-size:12.5px;font-weight:600}
.tlb{color:var(--tx2);font-size:11.5px;margin-top:4px;max-width:1000px}
.act-rule{font-family:"IBM Plex Mono";font-size:10.5px;color:var(--acc2);background:#fbf8ef;border:1px solid #ece3cd;border-radius:4px;padding:5px 9px;margin-top:6px;display:inline-block}

.ctrl{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.inp{background:var(--panel);border:1px solid var(--b2);color:var(--tx);padding:6px 12px;font-family:"IBM Plex Mono";font-size:10px;border-radius:4px;outline:none;width:230px}
.inp:focus{border-color:var(--acc)}.inp::placeholder{color:var(--mu)}
.btn{padding:5px 12px;font-family:"IBM Plex Mono";font-size:8.5px;font-weight:600;border:1px solid var(--b2);border-radius:4px;cursor:pointer;background:var(--panel);color:var(--tx2);letter-spacing:.5px}
.btn:hover{border-color:var(--acc);color:var(--acc2)}
.btn.act{border-color:var(--acc);color:#fff;background:var(--acc)}
.note{font-size:10.5px;color:var(--mu);margin-top:8px;font-style:italic}
.warn{border:1px solid #e0c5c5;background:#fdf7f7;border-radius:5px;padding:11px 14px;margin:12px 0;font-size:12px}
.warn .h{font-family:"IBM Plex Mono";font-size:8px;letter-spacing:1.4px;color:var(--neg);text-transform:uppercase;margin-bottom:5px}
.ok{border-color:#c9e2d5;background:#f6fbf8}
.ok .h{color:var(--pos)}
.goldbox{border-color:#e6dcc0;background:#fdfbf4}
.goldbox .h{color:var(--acc2)}
.sb{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.sbc{font-family:"IBM Plex Mono";font-size:9px;color:var(--tx2);background:var(--panel);border:1px solid var(--bd);border-radius:4px;padding:4px 9px}
.sbc b{color:var(--acc2)}
kbd{font-family:"IBM Plex Mono";font-size:9px;border:1px solid var(--b2);border-radius:3px;padding:0 5px;color:var(--tx2)}
</style>
</head>
