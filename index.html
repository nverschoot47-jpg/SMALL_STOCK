function macroCard(m){
 const d=m.dir>0?"pos":"neg";
 return `<div class="card" id="mac-${m.id}">
 <div class="desk">${m.desk}${m.extra?' · BUITEN DE KAART':''}</div>
 <div class="ct"><div class="ctl">${m.sym}<small>${m.name} — ${m.sub}</small></div>
 <div class="ctr ${d}">${m.px}${SB(m.pxSrc)}<small class="${d}">${m.chg} ${m.pct}</small></div></div>

 <div class="blk g"><div class="h">Dominant transmissiemechanisme — teken: <span class="sign ${m.mech.sign=='min'?'min':'plus'}">${m.mech.sign=='min'?'−':'+'}</span> ${m.mech.signTxt}</div>
 <b>${m.mech.title}</b></div>
 <div class="mech">${m.mech.chain.map(c=>`<span class="${c[1]}">${c[0]}</span>`).join('<span class="ar">→</span>')}</div>
 <div style="font-size:11px;color:var(--tx2)">${m.mech.note}</div>

 <div class="blk i"><div class="h">Waar het nu om draait</div>${m.conflict}</div>

 <div class="sh" style="margin:10px 0 4px"><b>NIVEAUS</b> · wie zit erachter</div>
 ${m.levels.map(l=>lvBox(l)).join("")}

 <div class="cone"><div class="b">${m.cone.bull} ▲ bull</div><div class="m">geteste bandbreedte<br>tot: ${m.cone.ev}</div><div class="r">▼ ${m.cone.bear} bear</div></div>
 <div class="note">De cone is geen voorspelling. Het zijn de niveaus die dit instrument in dit venster daadwerkelijk heeft getest, doorgetrokken naar de eerstvolgende gedateerde katalysator. Het enige nut is positiegrootte: is de afstand van spot tot de bearlijn meer dan je wilt verliezen, dan is de positie te groot — ongeacht hoe waarschijnlijk je de bullijn acht.</div>

 <div class="blk"><div class="h">Historisch precedent</div><b>${m.prec.d}</b> — ${m.prec.e}. Toen deed de prijs: ${m.prec.r}</div>
 <div class="blk p"><div class="h">Wat ik WEL wil zien</div>${m.wil.map(x=>"· "+x).join("<br>")}</div>
 <div class="blk n"><div class="h">Wat ik NIET wil zien</div>${m.niet.map(x=>"· "+x).join("<br>")}</div>

function biasScore(tk){
 const s=SECTORS.find(x=>x.pos.includes(tk));
 const f4=s?s.f4:0, wind=s?s.wind:0;
 const p=PORT.find(x=>x.tk==tk);
 const drv=DRV.find(x=>x.k==tk);
 const comp=drv?Math.round(drv.v.reduce((a,b)=>a+b,0)/2):0;
 return {tot:f4*2+wind*2+comp, f4:f4, wind:wind, comp:comp, w:p?p.w:0};
}

"🚨 Tariefmuur onder druk — Dubbele rechtbank-slag","b":"SCOTUS sloeg IEEPA neer (6-3, 20 feb). Trump antwoordde met 10% globaal tarief onder Section 122 (150 dagen). Op 7 mei 2026 verklaarde de Court of International Trade ook de Section 122 tarieven ongeldig. Beide beslissingen in beroep. Tarieven worden nog geind. Deadline Section 122: 24 JULI 2026. Zonder verlenging of nieuwe authority = tariefmuur valt deels weg. Trump: breidt Sections 301 en 232 uit als alternatief.","tags":["24 Jul deadline","Section 301/232 als backup"],"cat":"HANDEL & TARIEVEN","st":"JURIDISCH","when":"24 jul deadline"},{"t":"🤝 China deal verlengd + US-Iran MOU = markt rally","b":"China tarief-truce verlengd door november 2026 (nov 2025 akkoord). Fentanyl tarieven China verlaagd van 20% naar 10%. Trump State Visit China (mei 2026) leverde historische deals. US-Iran MOU getekend 22 juni 2026 = Goldman recessiekans verlaagd naar 15%. Olieprijzen daalden. Geopolitieke risico-premie verminderd.","tags":["UUUU/NXE/MP ↑","Markt rally","Olie ↓ = PARR let op"],"cat":"HANDEL & TARIEVEN","st":"ACTIEF","when":"t/m nov 2026"},{"t":"⛏ VS-EU Critical Minerals Action Plan","b":"USTR Greer kondigde VS-EU actieplan aan voor critical minerals supply chain resilience. Doel: Allied landen preferentiele toegang versus China en niet-allied producenten. Direct relevant voor uranium, rare earths en kritieke mineralen. Domestic + Allied producenten winnen.","tags":["UUUU ↑","NXE ↑","MP ↑","IE ↑","ASPI ↑"],"cat":"CRITICAL MINERALS","st":"ACTIEF","when":"VS-EU plan"},{"t":"🇧🇷 Section 301 — Nieuwe tarieven op Brazilië voorgesteld","b":"USTR publiceerde Federal Register notice voor actie op Braziliaanse importen. Aankondiging 1 juni 2026, deadline publieke reacties 1 juli. Onderdeel van bredere \"reciprocal tariff\" strategie na IEEPA-ongeldigverklaring. Brazilië = staal, landbouw, vliegtuigonderdelen.","tags":["Staal ↑","EMBRAER risico"],"cat":"HANDEL & TARIEVEN","st":"VOORGESTELD","when":"Brazilië 25%"},{"t":"⚙️ Section 232 uitgebreid — Koper, pharma, semiconductors, lumber","b":"Feb 20 proclamatie voegde nieuwe productcategorieën toe aan Section 232 tarieven: koper, farmaceutica, halfgeleiders, hout, kritieke mineralen en energieproducten. Dit is het primaire tarief-instrument na SCOTUS sloeg IEEPA neer. Koper +25%, semiconductors = nationaal veiligheidsgrond.","tags":["INTC ↑","TMQ/IE ↑","Pharma herlocatie ↑"],"cat":"HANDEL & TARIEVEN","st":"ACTIEF","when":"S232 uitbreiding"},{"t":"💰 Overheid koopt DIRECT aandelen in mijnbouwbedrijven","b":"De Amerikaanse overheid neemt nu directe equity-stakes in kritieke-mineralen bedrijven: DoD kocht 15% van MP Materials ($400M + $150M lening + 10-jaar prijsgarantie), $670M in magneetfabrikant Vulcan Elements, en $35.6M in het Canadese Trilogy Metals (TMQ) + warrants. DOE zet $2.26B lening voor American Lithium's Thacker Pass om in een 5-10% belang. Dit is ongekend — de staat wordt mede-eigenaar om China's dominantie te breken.","tags":["TMQ DoD stake ↑↑","LAC Thacker Pass ↑","Mining sector breed ↑"],"cat":"CRITICAL MINERALS","st":"ACTIEF","when":"DoD-belangen"},{"t":"⛏️ Processed Critical Minerals — tarief-dreiging + prijsvloeren","b":"Section 232 proclamatie over verwerkte kritieke mineralen (PCMDPs). Onderhandelingen met bondgenoten lopen tot 13 juli 2026; falen ze, dan komen er tarieven. Plus: \"minimum import prices\" (prijsvloeren) voor 60 mineralen op de USGS-lijst — rare earths, lithium, kobalt, gallium, germanium. VS is 100% importafhankelijk voor 12 mineralen, >50% voor 29 andere. Dit beschermt domestic + allied producenten tegen Chinese dumping.","tags":["HYMC/UUUU ↑","NB/CRML allies ↑","China rare earth ↓"],"cat":"CRITICAL MINERALS","st":"DREIGING","when":"prijsvloeren"},{"t":"⚖️ AI Litigation Task Force — Federale AI-wet vs Staten","b":"EO \"Ensuring a National Policy Framework for AI\" gaf DOJ opdracht om staats-AI-wetten in federale rechtbank aan te vechten (gestart 10 jan 2026). Commerce moet $42B BEAD breedbandsubsidie koppelen aan intrekken van \"te belastende\" staats-AI-regels. FTC classificeert verplichte bias-mitigatie als misleidende handelspraktijk. Doel: één federaal AI-kader i.p.v. lappendeken per staat.","tags":["PLTR ↑ minder regeldruk","NVDA ↑","AI sector breed ↑"],"cat":"AI & TECH","st":"ACTIEF","when":"task force"},{"t":"❌ AI Cybersecurity EO — op laatste moment geannuleerd","b":"Trump trok uren voor de geplande ondertekening een EO in die AI-bedrijven zou vragen de overheid vroege test-toegang tot nieuwe modellen te geven. AI-executives werden al op het Witte Huis verwacht. Reden: Trump vond delen ervan niet acceptabel. CISA zou bindende richtlijnen krijgen voor cyber-verdediging. Toont onzekerheid in AI-regulering — markt let op de volgende versie.","tags":["AI regelgeving onzeker","PLTR/NVDA watch"],"cat":"AI & TECH","st":"GEANNULEERD","when":"ingetrokken"},{"t":"⚖️ IEEPA Tarieven — Supreme Court verklaarde ONGELDIG (20 feb 2026)","b":"UPDATE: Op 20 feb 2026 oordeelde de Supreme Court (Learning Resources v. Trump) dat IEEPA Trump NIET de bevoegdheid gaf om die tarieven op te leggen. Trump verschoof daarna naar Section 232-tarieven (staal, aluminium, auto's, halfgeleiders, kritieke mineralen) die wél juridisch standhouden. Section 232 is nu het primaire tarief-instrument.","tags":["AAPL China risk","Importeurs watch","Reshoring ↑ ESAB"],"cat":"HANDEL & TARIEVEN","st":"ONGELDIG VERKLAARD","when":"20 feb 2026"},{"t":"⚛️ Nucleaire Renaissance — 4 EOs voor reactoren + NRC hervorming","b":"Vier executive orders: \"Deploying Advanced Nuclear Reactor Technologies for National Security\", NRC-hervorming, reactor-testen bij DOE, en herstel nucleaire industriebasis. Doel: SMR (small modular reactors) versnellen voor datacenters + defensie. AI-datacenters hebben enorme stroomvraag — kernenergie is het antwoord. Lopende vergunningsversnelling.","tags":["Uranium/SMR sector ↑","Data center power ↑","AAON/LMB cooling ↑"],"cat":"ENERGIE","st":"ACTIEF","when":"4 EOs"},{"t":"🚁 \"Unleashing American Drone Dominance\" + Airspace Sovereignty","b":"EO's voor herstel Amerikaanse luchtruim-soevereiniteit en versnelling binnenlandse drone-industrie. BVLOS-regels versoepeld, anti-drone systemen tegen vijandige UAS, en voorkeur voor Amerikaanse drone-fabrikanten in federale inkoop (weg van Chinese DJI). Direct relevant voor ONDS — enige operationele BVLOS-waiver. Lopende implementatie via FAA.","tags":["ONDS DIRECT ↑↑","Anti-China drone ↑","OUST border ↑"],"cat":"DEFENSIE & GRENS","st":"ACTIEF","when":"drone EO"},{"t":"🎯 \"America First Arms Transfer Strategy\" + Phosphorus Supply","b":"EO voor versnelde wapenexport aan bondgenoten (minder bureaucratie voor defensie-deals). Plus EO (18 feb 2026) die binnenlandse productie van elementair fosfor en glyfosaat-herbiciden veiligstelt als nationaal defensiebelang. Defensie-industriebasis = aanhoudende Trump-prioriteit. Direct voordeel voor defensie-electronica en autonome systemen.","tags":["DRS defense electronics ↑","ONDS/OUST ↑","Wapenexporteurs ↑"],"cat":"DEFENSIE & GRENS","st":"ACTIEF","when":"arms transfer"},{"t":"⚡ \"America's Beautiful Clean Coal Power Generation Fleet\"","b":"EO om kolencentrales open te houden/heractiveren voor de groeiende stroomvraag van AI-datacenters. Gecombineerd met de National Energy Dominance Council. Filosofie: alle binnenlandse energiebronnen (kolen, gas, nucleair) inzetten om AI-infrastructuur te voeden. Lopende uitvoering — EPA versoepelt emissienormen.","tags":["PARR/PRM energie ↑","Coal/Gas ↑","Solar/Wind ↓"],"cat":"ENERGIE","st":"ACTIEF","when":"coal EO"},{"t":"💊 Most-Favored-Nation Drug Pricing — in debat","b":"EO \"Delivering Most-Favored-Nation Prescription Drug Pricing\" wil dat de VS niet meer betaalt dan het laagste prijsland. Dubbelzijdig signaal: positief voor consumenten, maar margedruk voor pharma. Wordt nog juridisch en via onderhandeling uitgevochten. Relevant voor biotech met dure therapieën — maar minder voor pre-revenue namen (NRXP) die nog niet prijzen.",   return true;});
 $("#ustats").innerHTML=[["Getoond",rows.length+" / "+UNIV.length],["Trump ≥4",rows.filter(r=>r.trump>=4).length],
  ["Open-markt kopen",rows.filter(r=>r.sig.includes("cP")).length],["Clusters",rows.filter(r=>r.sig.includes("cl")).length],
  ["Verkoop-vlag",rows.filter(r=>r.sig.includes("se")).length],["Mijn posities",rows.filter(r=>myTk.includes(r.tk)).length]]

   .filter(x=>x.items.length).sort((a,b)=>{
     const av=a.items.reduce((s,i)=>s+i.trump,0)/a.items.length, bv=b.items.reduce((s,i)=>s+i.trump,0)/b.items.length;
     return bv-av;});
 $("#ubody").innerHTML=groups.map(gr=>{

   <td>${u.co}</td><td class="tx2" style="font-size:10px">${u.sec}</td>

   <td style="font-size:10.5px">${b?`<span class="pos mono">KOOP</span> ${b.n}${b.r?' ('+b.r+')':''} · ${b.d} · ${b.p} · <b class="pos">${b.v}</b>`:'<span class="mu">geen koop gedocumenteerd</span>'}
    ${s?`<div class="neg" style="margin-top:2px"><span class="mono">VERKOOP</span> ${s.n} · ${s.d} · ${s.v}</div>`:''}

  </tbody></table></div>`}).join("")||`<div class="warn">Geen namen in deze selectie.</div>`;
